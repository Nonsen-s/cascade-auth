worker_processes auto;
pid /tmp/nginx.pid;
# Error contexts may include raw request URLs with one-time tokens.
# API diagnostics and the status-only access log remain available.
error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format safe '$request_method $status request_id=$upstream_http_x_request_id';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        set $api http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location /api/ {
            proxy_pass $api;
        }

        location /health/ {
            proxy_pass $api;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
